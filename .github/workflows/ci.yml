name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Syntax check
        run: bash -n install.sh update.sh uninstall.sh awg-client awg-watchdog block-ping tools/bump-upstream.sh lib/common.sh tests/test-install.sh tests/test-reliability.sh tests/helpers/reliability.sh
      - name: ShellCheck
        run: shellcheck -x install.sh update.sh uninstall.sh awg-client awg-watchdog block-ping tools/bump-upstream.sh lib/common.sh tests/test-install.sh tests/test-reliability.sh tests/helpers/reliability.sh

  install-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:24.04"]
    container:
      image: ${{ matrix.image }}
      options: --privileged   # the mss reliability case needs network namespaces and nft
    steps:
      - uses: actions/checkout@v7
      - name: Build binaries (tests the build path)
        run: bash install.sh --build-only /opt/awg-bin
      - name: Built commits match upstream.lock
        run: |
          grep -v '^#' upstream.lock | sort > /tmp/lock.sorted
          sort /opt/awg-bin/versions > /tmp/built.sorted
          diff /tmp/lock.sorted /tmp/built.sorted
      - name: Install and client management
        run: bash tests/test-install.sh /opt/awg-bin
      - name: Reliability checks
        run: AWG_TEST_ALLOW_DESTRUCTIVE=1 bash tests/test-reliability.sh /opt/awg-bin all
